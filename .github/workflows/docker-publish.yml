# CI/CD do IGNIS Multimodal: testes, build da imagem, teste de fumaça e publicação no GHCR.
#
# - Pull requests e pushes na main: testes + build + teste de fumaça (nada é publicado).
# - Tag SemVer (git tag v0.1.0 && git push origin v0.1.0): publica
#   ghcr.io/viniciuskanh/ignis-multimodal:{0.1.0, 0.1, latest, sha-xxxxxxx}.
# - Execução manual (workflow_dispatch) com "publish" marcado: publica edge/sha da main.
#
# Usa apenas runners gratuitos ubuntu-latest (sem GPU) e o GITHUB_TOKEN automático.
# Nenhum peso de modelo, dataset ou credencial é incluído na imagem.
name: CI e publicação Docker (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/media/**"
      - "docs/assets/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a imagem no GHCR (tags edge e sha)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/viniciuskanh/ignis-multimodal
  PYTHON_VERSION: "3.13"
  TORCH_VERSION: "2.11.0"
  TORCHVISION_VERSION: "0.26.0"

jobs:
  tests:
    name: Testes (Python, frontend, Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências (PyTorch CPU no CI)
        run: |
          python -m pip install "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Testes de contrato (sem pesos, sem GPU)
        run: python -m pytest -q -p no:cacheprovider

      - name: Testes do transporte HTTP
        env:
          IGNIS_TEST_HTTP: "1"
        run: python -m pytest -q -p no:cacheprovider

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validar Docker Compose (CPU e GPU)
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config | grep -q "driver: nvidia"

  docker:
    name: Imagem Docker
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espaço em disco do runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Metadados e tags SemVer
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=IGNIS Multimodal
            org.opencontainers.image.description=Plataforma local de IA multimodal (visão, Diffusers, LoRA). Sem pesos de modelos.
            org.opencontainers.image.authors=Vinicius de Souza Santos

      - name: Build da imagem (CUDA 12.8)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          while IFS= read -r label; do [ -n "$label" ] && args+=(--label "$label"); done <<< "$LABELS"
          DOCKER_BUILDKIT=1 docker build "${args[@]}" --tag ignis-multimodal:ci \
            --build-arg TORCH_VARIANT=cu128 \
            --build-arg TORCH_VERSION="${TORCH_VERSION}" \
            --build-arg TORCHVISION_VERSION="${TORCHVISION_VERSION}" \
            --build-arg IGNIS_VERSION="${VERSION}" \
            --build-arg VCS_REF="${GITHUB_SHA}" .
          docker image ls ignis-multimodal:ci
          df -h /

      - name: Teste de fumaça do container (CPU; o runner não possui GPU)
        run: bash scripts/docker-smoke-test.sh ignis-multimodal:ci

      - name: Login no GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags "${IMAGE_NAME}"
          digest=$(docker image inspect ignis-multimodal:ci --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${IMAGE_NAME}@" | head -1)
          size=$(docker image inspect ignis-multimodal:ci --format '{{.Size}}')
          {
            echo "## Imagem publicada"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagem | \`${IMAGE_NAME}\` |"
            echo "| Versão | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Digest | \`${digest#*@}\` |"
            echo "| Tamanho descompactado | $((size / 1024 / 1024)) MiB |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Execução: \`docker pull ${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${digest}"

      - name: Resumo (sem publicação)
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "## Imagem construída e testada (não publicada)"
            echo "Publicação ocorre em tags \`v*.*.*\` ou por execução manual com \`publish\`."
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
